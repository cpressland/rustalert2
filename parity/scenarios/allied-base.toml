name = "allied-base"
description = """
The human player (British) deploys its MCV and builds a power plant, a
barracks, a GI, a second barracks and two more GIs, by orders the recorder
queues as the sidebar's clicks would. Covers deploying, build times, paying
for production a step at a time, placing buildings, power, and the second
factory's speed-up. Nothing else is near: the AI starts in the far corner."""
map = "parity_allied_base.yrm"
end_frame = 1700
human_start = [35, 35]

