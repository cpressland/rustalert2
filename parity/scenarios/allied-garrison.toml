name = "allied-garrison"
description = """
Garrisons. A Neutral civilian house (CAHSE01) stands west of the human
player's (British) base, and a Neutral Grizzly sleeps six cells beyond it.
The player builds a power plant and a barracks, trains a GI and sends it
into the house (a capture order: an Enter order on it is taken as an
attack). Covers occupying a building: whose it becomes, and the
occupant firing from it (OccupyWeapon=, and the Occupy multipliers). The
AI starts in the far corner."""
map = "parity_allied_garrison.yrm"
end_frame = 2000
human_start = [35, 35]

[generate]
name = "allied-garrison"
width = 50
height = 50
starts = [[35, 35], [65, 65]]

[[generate.house]]
name = "Neutral"

[[generate.structure]]
owner = "Neutral"
type = "CAHSE01"
x = 28
y = 36

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 22
y = 37
facing = 64
mission = "Sleep"

[[order]]
frame = 30
what = "deploy"
type = "AMCV"

[[order]]
frame = 100
what = "produce"
type = "GAPOWR"

[[order]]
frame = 600
what = "place"
type = "GAPOWR"
x = 38
y = 34

[[order]]
frame = 610
what = "produce"
type = "GAPILE"

[[order]]
frame = 900
what = "place"
type = "GAPILE"
x = 38
y = 37

[[order]]
frame = 910
what = "produce"
type = "E1"

[[order]]
frame = 1500
what = "capture"
type = "E1"
target = "CAHSE01"

# Tolerances: the GI comes out of the barracks as the original's does but
# walks faster (see locomotors.md), so the house is his 30 frames sooner.

# Neutral until the GI is in...
[[check]]
what = "count"
type = "CAHSE01"
owner = 2
at = 1650
tolerance = 0

# ...then the player's, unhurt, with the GI inside (still counted). The
# garrison didn't fire on the Grizzly six cells off in the original.
[[check]]
what = "count"
type = "CAHSE01"
owner = 0
at = 1800
tolerance = 0

[[check]]
what = "hp"
type = "CAHSE01"
at = 2000
tolerance = 0

[[check]]
what = "count"
type = "E1"
owner = 0
at = 2000
tolerance = 0

[[check]]
what = "hp"
type = "MTNK"
at = 2000
tolerance = 0
