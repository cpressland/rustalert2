name = "allied-engineer-capture"
description = """
Engineers capturing. A Neutral power plant stands west of the human
player's (British) base. The player builds a power plant and a barracks,
trains an engineer and sends it into the Neutral plant. Covers capturing
an enemy building: who owns it after, its health, the house's power, and
what becomes of the engineer. Nothing else is near: the AI starts in the
far corner."""
map = "parity_allied_engineer_capture.yrm"
end_frame = 2000
human_start = [35, 35]

[generate]
name = "allied-engineer-capture"
width = 50
height = 50
starts = [[35, 35], [65, 65]]

[[generate.house]]
name = "Neutral"

[[generate.structure]]
owner = "Neutral"
type = "GAPOWR"
x = 28
y = 36

[[order]]
frame = 30
what = "deploy"
type = "AMCV"

[[order]]
frame = 100
what = "produce"
type = "GAPOWR"

[[order]]
frame = 600
what = "place"
type = "GAPOWR"
x = 38
y = 34

[[order]]
frame = 610
what = "produce"
type = "GAPILE"

[[order]]
frame = 900
what = "place"
type = "GAPILE"
x = 38
y = 37

[[order]]
frame = 910
what = "produce"
type = "ENGINEER"

[[order]]
frame = 1500
what = "capture"
type = "ENGINEER"
target = "GAPOWR"

# Tolerances: our engineer comes out of the barracks on the same frame and
# cell as the original's, but walks faster on straight stretches (10.8
# leptons a frame against 9.8; infantry speed is fitted, see
# locomotors.md), so it goes in 31 frames sooner.

# The engineer goes in and is used up...
[[check]]
what = "event"
type = "ENGINEER"
owner = 0
event = "removed"
window = 40

# ...and the Neutral plant is the player's, as it stood, with its power
# counted at once: the player's output 400, the Neutral house's none.
[[check]]
what = "count"
type = "GAPOWR"
owner = 0
at = 1800
tolerance = 0

[[check]]
what = "hp"
type = "GAPOWR"
owner = 0
at = 1800
tolerance = 0

[[check]]
what = "power"
house = 0
at = 1800
tolerance = 0

[[check]]
what = "power"
house = 2
at = 1800
tolerance = 0
