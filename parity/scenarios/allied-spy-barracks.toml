name = "allied-spy-barracks"
description = """
Spies. A Neutral barracks stands west of the human player's (British)
base. The player builds a power plant and a barracks, trains a spy (the
map makes it cheaper and needs only the barracks), sends it into the
Neutral barracks, then trains a GI. Covers infiltrating: what becomes of
the spy, and a barracks' gift: the house's infantry come out veterans.
The AI starts in the far corner."""
map = "parity_allied_spy_barracks.yrm"
end_frame = 2200
human_start = [35, 35]

[generate]
name = "allied-spy-barracks"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[SPY]
Prerequisite=GAPILE
Cost=500
"""

[[generate.house]]
name = "Neutral"

[[generate.structure]]
owner = "Neutral"
type = "GAPILE"
x = 27
y = 36

[[order]]
frame = 30
what = "deploy"
type = "AMCV"

[[order]]
frame = 100
what = "produce"
type = "GAPOWR"

[[order]]
frame = 600
what = "place"
type = "GAPOWR"
x = 38
y = 34

[[order]]
frame = 610
what = "produce"
type = "GAPILE"

[[order]]
frame = 900
what = "place"
type = "GAPILE"
x = 38
y = 37

[[order]]
frame = 910
what = "produce"
type = "SPY"

[[order]]
frame = 1500
what = "capture"
type = "SPY"
target = "GAPILE"

[[order]]
frame = 1800
what = "produce"
type = "E1"

# Tolerances: the spy comes out of the barracks as the original's does but
# walks faster (see locomotors.md), so it goes in 31 frames sooner. The
# order is the capture mission: an Enter order left the spy standing
# beside the barracks.

# The spy goes in and is used up...
[[check]]
what = "event"
type = "SPY"
owner = 0
event = "removed"
window = 40

# ...and the GI begun after comes out a veteran (experience 1 from the
# start of its training). A GI begun before the spy went in stayed a
# rookie in an earlier recording.
[[check]]
what = "experience"
type = "E1"
owner = 0
at = 1850
tolerance = 0
