name = "grizzly-crush"
description = """
A Grizzly crushing infantry. The human player (British) builds a power
plant and a war factory (the map makes it cheaper, with fewer
prerequisites), then a Grizzly, which is moved to a set cell and then
straight east through two sleeping Neutral GIs, one in the middle of its cell and one
in a corner. Covers Crusher= against
Crushable= infantry: when the GI dies, and whether it moves aside first.
The AI starts in the far corner."""
map = "parity_grizzly_crush.yrm"
end_frame = 2400
human_start = [35, 35]

[generate]
name = "grizzly-crush"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[GAWEAP]
Prerequisite=POWER,GACNST
Cost=500


"""

