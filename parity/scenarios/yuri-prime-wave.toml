name = "yuri-prime-wave"
description = """
Yuri Prime's psychic wave. The Yuri player builds a Bio Reactor and a
barracks, trains Yuri Prime (the map makes him cheaper and needs only the
barracks), walks him beside sleeping Neutral GIs and a Grizzly and deploys him.
Covers deploying (Deployer=, DeployFire=) and SuperPsiWave (AreaFire=,
warhead SuperPsiPulse: CellSpread=5, PercentAtMax=.85, half on vehicles,
AffectsAllies=no). The AI starts in the far corner."""
map = "parity_yuri_prime_wave.yrm"
end_frame = 1900
human_start = [35, 35]
human_country = "YuriCountry"

