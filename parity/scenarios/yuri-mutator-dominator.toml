# Both superweapons granted and charged as the others.
[[check]]
what = "supers"
house = 0
at = 1012
tolerance = 0

# The Genetic Mutator at 1101: every GI within its warhead's 5 cells goes
# at once (the one three cells off too); they stand up as Yuri's Brutes 61
# or 62 frames later. The Neutral Grizzly isn't touched. (After that the
# Brutes and the Grizzly fight, which isn't modelled yet.)
[[check]]
what = "supers"
house = 0
at = 1101
tolerance = 0

[[check]]
what = "count"
type = "E1"
owner = 2
at = 1101
tolerance = 0

[[check]]
what = "count"
type = "BRUTE"
owner = 0
at = 1163
tolerance = 0

[[check]]
what = "count"
type = "MTNK"
owner = 2
at = 1163
tolerance = 0

# The Psychic Dominator at 1401: 37 frames on, the units within one cell of
# the target (two Grizzlies and a GI) become Yuri's; the Grizzlies two and
# four cells off stay Neutral. (By then the Brutes have destroyed the
# Grizzly by the Mutator's target, so Neutral Grizzlies aren't counted.)
[[check]]
what = "supers"
house = 0
at = 1401
tolerance = 0

[[check]]
what = "count"
type = "MTNK"
owner = 0
at = 1437
tolerance = 0

[[check]]
