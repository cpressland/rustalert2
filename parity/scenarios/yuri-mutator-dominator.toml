name = "yuri-mutator-dominator"
description = """
The human plays Yuri: deploys, builds a Bio Reactor, a Genetic Mutator and
a Psychic Dominator, and fires each at Neutral units well away from the
base. The map's rules make both superweapon buildings cheap, powerless
and buildable from the Construction Yard alone, recharging in 18
seconds."""
map = "parity_yuri_mutator_dominator.yrm"
end_frame = 1900
human_start = [35, 35]
human_country = "YuriCountry"
super_weapons = true

[generate]
name = "yuri-mutator-dominator"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[YAGNTC]
Prerequisite=YACNST
Cost=500
Power=0

[YAPPET]
Prerequisite=YACNST
Cost=500
Power=0

[GeneticConverterSpecial]
RechargeTime=.3

[PsychicDominatorSpecial]
RechargeTime=.3
"""

[[generate.house]]
name = "Neutral"

# The Genetic Mutator's targets: GIs on and beside the target and three
# cells off, and a Grizzly.
[[generate.infantry]]
owner = "Neutral"
type = "E1"
x = 45
y = 25

[[generate.infantry]]
owner = "Neutral"
type = "E1"
x = 46
y = 25

[[generate.infantry]]
owner = "Neutral"
type = "E1"
x = 45
y = 28

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 44
y = 25

# The Psychic Dominator's: Grizzlies on the target and one, two and four
# cells off, and a GI.
[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 25
y = 45

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 24
y = 45

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 23
y = 45

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 21
y = 45

[[generate.infantry]]
owner = "Neutral"
type = "E1"
x = 25
y = 46

