The spy without a disguise, beside an enemy. As allied-spy-disguise but
the spy isn't told to take the GI's look: it walks up beside the Neutral
GI on Guard as it is. Covers what the GI makes of a spy in its own house's
disguise. The AI starts in the far corner."""
map = "parity_allied_spy_undisguised.yrm"
end_frame = 2100
human_start = [35, 35]

