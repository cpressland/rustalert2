# The house fires from the frame after the order, its GIs in turn: 15
# (plus 0 to 2) over three occupants is 5 frames, over
# OccupyROFMultiplier=1.2 is 4, rounded up to odd is 5. With three the
# random part drops out, so the Grizzly's health is exact all the way.
# The kill's experience is a GI's, not the house's.
[[check]]
what = "count"
type = "MTNK"
at = 2590
tolerance = 0

