name = "allied-garrison-three"
description = """
A garrison of three. As allied-garrison-fire, but three GIs go into the
Neutral civilian house (CAHSE01) one after another, before it's ordered to
attack the sleeping Neutral Grizzly three cells off. Covers how several
occupants fire: in turn or together, and at what rate. The AI starts in
the far corner."""
map = "parity_allied_garrison_three.yrm"
end_frame = 3000
human_start = [35, 35]

