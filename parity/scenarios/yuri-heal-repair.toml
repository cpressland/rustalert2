name = "yuri-heal-repair"
description = """
Self-healing and repair. Neutral units start half-damaged far from
everything: a War Miner (SelfHealing=yes), a Rhino and a Conscript
(neither heals). The human plays Yuri: builds a Bio Reactor and a (cheap)
Psychic Dominator, fires it seven cells from the reactor (its warhead hits
only buildings, and leaves no radiation), then orders the damaged reactor
repaired. Covers self-healing, the Dominator's damage to buildings, and
building repair and its cost."""
map = "parity_yuri_heal_repair.yrm"
end_frame = 2600
human_start = [35, 35]
human_country = "YuriCountry"
super_weapons = true

[generate]
name = "yuri-heal-repair"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[YAPPET]
Prerequisite=YACNST
Cost=500
Power=0

[PsychicDominatorSpecial]
RechargeTime=.3
"""

[[generate.house]]
name = "Neutral"

[[generate.unit]]
owner = "Neutral"
type = "HARV"
x = 45
y = 22
health = 128

[[generate.unit]]
owner = "Neutral"
type = "HTNK"
x = 48
y = 22
health = 128

[[generate.infantry]]
