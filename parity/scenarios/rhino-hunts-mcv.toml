name = "rhino-hunts-mcv"
description = """
A Rhino on Hunt, owned by Neutral, drives from the middle of a flat clear
map to the idle human player's MCV, stops at weapon range and shells it.
Covers driving speed and path, where a unit stops for its weapon's range,
damage (Verses) and rate of fire.

In a skirmish the map's objects are read before the player houses exist, so
only Neutral and Special can own them; Neutral is hostile to the players.
One AI starts in the far corner and doesn't reach the area in time."""
map = "parity_rhino_hunts_mcv.yrm"
end_frame = 900
human_start = [35, 35]

[generate]
name = "Parity: Rhino hunts MCV"
width = 50
height = 50
starts = [[35, 35], [65, 65]]

[[generate.house]]
name = "Neutral"

[[generate.unit]]
owner = "Neutral"
type = "HTNK"
x = 47
y = 50
facing = 64
mission = "Hunt"

# Tolerances: two recordings of the original with the same start differ only
# in when shots land (the gap between shots varies by 0 to 2 frames with the
# seed), so damage checks allow about one shot and timing a few frames.

[[check]]
what = "position"
type = "HTNK"
owner = 2
at = 120
tolerance = 64

[[check]]
what = "position"
type = "HTNK"
owner = 2
at = 300
tolerance = 32

[[check]]
what = "first_damage"
type = "AMCV"
owner = 0
window = 3

[[check]]
what = "hp"
type = "AMCV"
owner = 0
at = 600
tolerance = 90

[[check]]
what = "hp"
type = "AMCV"
owner = 0
at = 900
tolerance = 90
