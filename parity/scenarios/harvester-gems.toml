name = "harvester-gems"
description = """
A War Miner on Harvest, owned by Neutral, beside a Neutral Soviet refinery
and a 5×5 field of full gems (GEM01, overlay 27). It drives to the ore, fills up, drives back,
unloads, and goes again. Covers harvesting rate, the miner's capacity,
docking and unloading, and the credits each load is worth.

Neutral owns everything so the players (far away at the start points) stay
out of it; Neutral's credits are what the refinery pays into."""
map = "parity_harvester_gems.yrm"
end_frame = 3000
human_start = [35, 35]

[generate]
name = "Parity: harvester and gems"
width = 50
height = 50
starts = [[35, 35], [65, 65]]

[[generate.house]]
name = "Neutral"

[[generate.structure]]
owner = "Neutral"
type = "NAREFN"
x = 45
y = 45

[[generate.unit]]
owner = "Neutral"
type = "HARV"
x = 44
y = 49
facing = 64
mission = "Harvest"

[[generate.ore]]
x = 52
y = 44
width = 5
height = 5
overlay = 27

# The first load: four cells, eleven bails each until it's full.

# Gems harvest as ore does, a bail every 19 frames, and are worth 50 a bail
# (GemValue=); those checks are exact. Our miner runs ahead of the original
# from its corners (it doesn't stop to turn; see locomotors.md): 12 frames
# by its first bail, 50 by its second trip, so the late checks are loose.

[[check]]
what = "position"
type = "HARV"
owner = 2
at = 400
tolerance = 32

[[check]]
what = "cargo"
type = "HARV"
owner = 2
at = 700
tolerance = 1

[[check]]
what = "cargo"
type = "HARV"
owner = 2
at = 1100
tolerance = 1

[[check]]
what = "ore"
at = 1200
tolerance = 1

[[check]]
what = "cargo"
type = "HARV"
owner = 2
at = 1300
tolerance = 0

# Docking: backing onto the pad, and paying for the load all at once.
[[check]]
