name = "allied-spy-battle-lab"
description = """
A spy in a battle lab. A Neutral Allied battle lab (GATECH) stands west of
the human player's (British) base. The player builds a power plant and a
barracks, trains a spy (the map makes it cheaper and needs only the
barracks), and is ordered to train a Chrono Commando (RequiresStolenAlliedTech=,
made cheaper) before the spy goes into the lab and again after. Covers a
battle lab's gift: the tech it lets the spy's house build. The AI starts in
the far corner."""
map = "parity_allied_spy_battle_lab.yrm"
end_frame = 2400
human_start = [35, 35]

[generate]
name = "allied-spy-battle-lab"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[SPY]
Prerequisite=GAPILE
Cost=500

[CCOMAND]
Cost=500
"""

[[generate.house]]
name = "Neutral"

[[generate.structure]]
owner = "Neutral"
type = "GATECH"
x = 27
y = 36

[[order]]
frame = 30
what = "deploy"
type = "AMCV"

[[order]]
frame = 100
what = "produce"
type = "GAPOWR"

[[order]]
frame = 600
what = "place"
type = "GAPOWR"
x = 38
y = 34

[[order]]
frame = 610
what = "produce"
type = "GAPILE"

[[order]]
frame = 900
what = "place"
type = "GAPILE"
x = 38
y = 37

[[order]]
frame = 910
what = "produce"
type = "SPY"

[[order]]
frame = 1300
what = "produce"
type = "CCOMAND"

[[order]]
frame = 1500
what = "capture"
type = "SPY"
target = "GATECH"

[[order]]
frame = 1800
what = "produce"
type = "CCOMAND"

# The spy goes in and is used up (infantry speed: see allied-spy-barracks)...
[[check]]
what = "event"
type = "SPY"
owner = 0
event = "removed"
window = 40

# ...the Chrono Commando ordered before is built (paid for by 1566) but
# stays in the barracks; in a recording without the second order it never
# came out...
[[check]]
what = "count"
type = "CCOMAND"
at = 1790
tolerance = 0

[[check]]
what = "count"
type = "CCOMAND"
limbo = false
at = 1801
tolerance = 0

[[check]]
what = "credits"
house = 0
at = 1790
tolerance = 0

# ...and ordered again, with the lab's tech, it comes out two frames on;
# no second one is built.
[[check]]
what = "count"
type = "CCOMAND"
limbo = false
at = 1802
tolerance = 0

[[check]]
what = "count"
type = "CCOMAND"
at = 2350
tolerance = 0
