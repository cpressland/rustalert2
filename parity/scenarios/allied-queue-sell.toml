name = "allied-queue-sell"
description = """
The British player builds a power plant and a barracks, queues three GIs,
starts a refinery, then sells the power plant. Selling lets out a crew GI,
pays half the plant's cost back 50 frames later, cuts the power, and
cancels the refinery (its POWER prerequisite is gone), refunding what was
paid. A GI part-built when the power goes slows to its low-power steps
from its next step; another is built at low power and a third cancelled.
The later order to place the refinery finds nothing to place.

Which cell each GI walks to on leaving the barracks isn't modelled (the
game's choice looks random), so GIs are counted, not placed."""
map = "parity_allied_queue_sell.yrm"
end_frame = 2500
human_start = [35, 35]

[generate]
name = "allied-queue-sell"
width = 50
height = 50
