name = "allied-gi-prone"
description = """
Prone infantry. A sleeping Neutral Conscript stands west of the human
player's (British) base. The player builds a power plant and a barracks,
trains a GI and orders it to attack the Conscript. Covers infantry going
prone under fire and the warhead's ProneDamage= (the M60's SA, 70%). The
AI starts in the far corner."""
map = "parity_allied_gi_prone.yrm"
end_frame = 1900
human_start = [35, 35]

