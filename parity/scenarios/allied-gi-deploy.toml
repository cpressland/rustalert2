name = "allied-gi-deploy"
description = """
The GI deploying. A Neutral Grizzly sleeps four cells west of where the
human player's (British) first GI will stand, in reach of its M60. The player builds a power
plant and a barracks, trains a GI and orders it to deploy. Covers
deploying: how long it takes, and the weapon after (the M60's 3 a hit on
heavy armour, the deployed Para's 10). The AI starts in the far corner."""
map = "parity_allied_gi_deploy.yrm"
end_frame = 1800
human_start = [35, 35]

[generate]
name = "allied-gi-deploy"
width = 50
height = 50
starts = [[35, 35], [65, 65]]

[[generate.house]]
name = "Neutral"

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 34
y = 39
facing = 64
mission = "Sleep"

[[order]]
frame = 30
what = "deploy"
type = "AMCV"

[[order]]
frame = 100
what = "produce"
type = "GAPOWR"

[[order]]
frame = 600
what = "place"
type = "GAPOWR"
x = 38
y = 34

[[order]]
frame = 610
what = "produce"
type = "GAPILE"

[[order]]
frame = 900
what = "place"
type = "GAPILE"
x = 38
y = 37

[[order]]
frame = 910
what = "produce"
type = "E1"

[[order]]
frame = 1300
what = "deploy"
type = "E1"

[[order]]
frame = 1302
what = "attack"
type = "E1"
target = "MTNK"

# The player's GI on Guard leaves the sleeping Neutral Grizzly alone (a
# player's units don't take on civilians by themselves) until ordered to
# attack. Deployed, it fires Para: 10 a hit on heavy armour every 17 to 19
# frames, from the frame after the order (ours a couple of frames later),
# where its M60 would do 3. It stays put.
[[check]]
what = "hp"
type = "MTNK"
at = 1300
tolerance = 0

[[check]]
what = "first_damage"
type = "MTNK"
window = 2

[[check]]
what = "hp"
type = "MTNK"
at = 1500
tolerance = 10

[[check]]
what = "hp"
type = "MTNK"
at = 1800
tolerance = 10

[[check]]
what = "position"
type = "E1"
owner = 0
at = 1800
tolerance = 0
