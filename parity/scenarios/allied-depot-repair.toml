name = "allied-depot-repair"
description = """
The Service Depot. The human player (British) builds a power plant, a war
factory and a Service Depot (the map makes both cheaper, with fewer
prerequisites), then a Grizzly and an IFV. The Grizzly is ordered to fire
on the IFV (as a forced attack on one's own unit), then away, and the
damaged IFV is sent into the depot. Covers a unit's repair at a depot: its
rate and cost. Nothing else is near: the AI starts in the far corner."""
map = "parity_allied_depot_repair.yrm"
end_frame = 2700
human_start = [35, 35]

[generate]
name = "allied-depot-repair"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[GAWEAP]
Prerequisite=POWER,GACNST
Cost=500

[GADEPT]
Prerequisite=GAWEAP,GACNST
Cost=300
"""

