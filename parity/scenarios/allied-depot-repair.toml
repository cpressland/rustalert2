# Tolerances: our Grizzly fires as soon as its order lands, where the
# original's first shell comes about 20 frames later (its turret turning;
# not modelled), and our units leave the war factory for other cells, so
# the IFV docks 13 frames later than the original's. The depot itself is
# checked exactly: one 8-point step 4 frames after docking, the next 85
# frames on, then one every 15, at 3 credits each, and off the pad 12
# frames after it's whole.

# One shell: 200 to 152.
[[check]]
what = "hp"
type = "FV"
owner = 0
at = 2005
tolerance = 0

# The first step.
[[check]]
what = "hp"
type = "FV"
owner = 0
at = 2150
tolerance = 0

[[check]]
what = "credits"
house = 0
at = 2150
tolerance = 0

# Whole after five steps, 15 credits in all.
[[check]]
what = "hp"
type = "FV"
owner = 0
at = 2300
tolerance = 0

[[check]]
what = "credits"
house = 0
at = 2300
tolerance = 0

# Off the pad, to the cell below the depot's left column.
[[check]]
what = "position"
type = "FV"
owner = 0
at = 2700
tolerance = 0
