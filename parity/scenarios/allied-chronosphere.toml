name = "allied-chronosphere"
description = """
The British player builds a power plant and a Chronosphere, then
teleports a group of Neutral units (two Grizzlies and a GI) from far
north-east of the base to far south-west: the Chronosphere's click on the
group, then the Chrono Warp's on where they go. The map's rules make the
Chronosphere cheap, powerless and buildable from the Construction Yard,
recharging in 18 seconds."""
map = "parity_allied_chronosphere.yrm"
end_frame = 1700
human_start = [35, 35]
super_weapons = true

[generate]
name = "allied-chronosphere"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[GACSPH]
Prerequisite=GACNST
Cost=500
Power=0

[ChronoSphereSpecial]
RechargeTime=.3
"""

