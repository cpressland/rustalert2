name = "allied-spy-war-factory"
description = """
A spy in a war factory. A Neutral war factory stands west of the human
player's (British) base. The player builds a power plant and a barracks,
trains a spy (the map makes it cheaper and needs only the barracks) and
sends it into the Neutral war factory, then places its own war factory
(cheaper, with fewer prerequisites, built earlier and held until the spy
has gone in, so the spy's target is the only war factory) and builds a
Grizzly. Covers a war factory's gift: the house's vehicles come out
veterans. The AI starts in the far corner."""
map = "parity_allied_spy_war_factory.yrm"
end_frame = 2800
human_start = [35, 35]

[generate]
name = "allied-spy-war-factory"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[SPY]
Prerequisite=GAPILE
Cost=500

[GAWEAP]
Prerequisite=POWER,GACNST
Cost=500
"""

[[generate.house]]
name = "Neutral"

[[generate.structure]]
owner = "Neutral"
type = "GAWEAP"
x = 24
y = 36

[[order]]
frame = 30
what = "deploy"
type = "AMCV"

[[order]]
frame = 100
what = "produce"
type = "GAPOWR"

[[order]]
frame = 600
what = "place"
type = "GAPOWR"
x = 38
y = 34

[[order]]
frame = 610
what = "produce"
type = "GAPILE"

[[order]]
frame = 900
what = "place"
type = "GAPILE"
x = 38
y = 37

[[order]]
frame = 910
what = "produce"
type = "SPY"

[[order]]
frame = 920
what = "produce"
type = "GAWEAP"

[[order]]
frame = 1500
what = "capture"
type = "SPY"
target = "GAWEAP"

[[order]]
frame = 1850
what = "place"
type = "GAWEAP"
x = 41
y = 36

[[order]]
frame = 1860
what = "produce"
type = "MTNK"

# The spy goes in and is used up (infantry speed: see allied-spy-barracks)...
[[check]]
what = "event"
type = "SPY"
owner = 0
event = "removed"
window = 40

# ...and the Grizzly built after comes out a veteran.
[[check]]
what = "experience"
type = "MTNK"
owner = 0
at = 2750
tolerance = 0
