The British player builds a power plant, a refinery (which gives a free
Chrono Miner), a barracks and a war factory, then a Grizzly. On the way it
holds and resumes a GI, and first tries to place the barracks somewhere
the game refuses (far from the base). Covers vehicles leaving a refinery
and a war factory, holding production, and refused placements."""
