# Tolerances: our units leave the war factory for other cells (see
# allied-depot-repair), so the first attack comes earlier, and our IFV
# mends on the move where the original's did so once it stopped, 9 frames
# later; the health it gets to and where it ends are exact.

# The IFV's HoverMissiles: two pairs of 8 on the Grizzly before it's sent
# off.
[[check]]
what = "hp"
type = "MTNK"
owner = 0
at = 2100
tolerance = 0

