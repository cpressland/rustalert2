name = "allied-ifv-repair"
description = """
The IFV's repair turret. The human player (British) builds a power plant,
a war factory and a barracks (the map makes the war factory cheaper, with
fewer prerequisites), then a Grizzly, an IFV and an engineer. The IFV is
ordered to fire on the Grizzly (a forced attack on one's own unit), the
engineer to get into the IFV, and the IFV then at the Grizzly again: with
an engineer aboard it carries RepairBullet, which mends vehicles. Covers
loading a transport, an IFV's weapon by its passenger, and repairing by
weapon. Nothing else is near: the AI starts in the far corner."""
map = "parity_allied_ifv_repair.yrm"
end_frame = 2800
human_start = [35, 35]

[generate]
name = "allied-ifv-repair"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[GAWEAP]
Prerequisite=POWER,GACNST
Cost=500

"""

