name = "allied-tanya-c4"
description = """
Tanya's C4. A Neutral power plant stands west of the human player's
(British) base. The player builds a power plant and a barracks, trains
Tanya (the map makes her cheaper and needs only the barracks) and orders
her to attack the plant. Covers what she does to a building: walking up,
the C4, and the building's end. Nothing else is near: the AI starts in the
far corner."""
map = "parity_allied_tanya_c4.yrm"
end_frame = 2000
human_start = [35, 35]

[generate]
name = "allied-tanya-c4"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[TANY]
Prerequisite=GAPILE
Cost=500
"""

[[generate.house]]
name = "Neutral"

[[generate.structure]]
owner = "Neutral"
type = "GAPOWR"
x = 28
y = 36

[[order]]
frame = 30
what = "deploy"
type = "AMCV"

[[order]]
frame = 100
what = "produce"
type = "GAPOWR"

[[order]]
frame = 600
what = "place"
type = "GAPOWR"
x = 38
y = 34

[[order]]
frame = 610
what = "produce"
type = "GAPILE"

[[order]]
frame = 900
what = "place"
type = "GAPILE"
x = 38
y = 37

[[order]]
frame = 910
what = "produce"
type = "TANY"

[[order]]
frame = 1500
what = "attack"
type = "TANY"
target = "GAPOWR"

# Tolerances: our Tanya walks faster than the original's (16.2 leptons a
# frame against 14.2; infantry speed is fitted, see locomotors.md), so she
# reaches the plant, and it goes, 22 frames sooner.

# She walks into the plant's nearest cell and plants her C4; standing on
# Guard, she pistols the plant meanwhile (1 a shot on concrete); 26 frames
# after she stopped the plant is gone, with no crew, and the Neutral
# house's power with it.
[[check]]
what = "event"
type = "GAPOWR"
owner = 2
event = "removed"
window = 30

[[check]]
what = "count"
type = "E1"
at = 1800
tolerance = 0

[[check]]
what = "power"
house = 2
at = 1800
tolerance = 0

[[check]]
what = "hp"
type = "TANY"
owner = 0
at = 1800
tolerance = 0
