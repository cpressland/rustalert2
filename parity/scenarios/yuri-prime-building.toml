name = "yuri-prime-building"
description = """
Yuri Prime taking a building. The Yuri player builds a Bio Reactor and a
barracks, trains Yuri Prime (the map makes him cheaper and needs only the
barracks) and orders him to attack a Neutral Allied power plant. Covers
his SuperMindControl (warhead ControllerBuilding, MindControl= with Verses=
on building armour): what taking a building does, here to its power. The
AI starts in the far corner."""
map = "parity_yuri_prime_building.yrm"
end_frame = 1900
human_start = [35, 35]
human_country = "YuriCountry"

[generate]
name = "yuri-prime-building"
