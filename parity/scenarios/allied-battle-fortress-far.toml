# The Fortress drives up and fires from 2451, 6 a hit every 20 to 22
# frames; the GI inside never fires, though the Fortress closes to within
# its reach. Two frames on the first hit, a hit on health.
[[check]]
what = "first_damage"
type = "MTNK"
window = 2

[[check]]
what = "hp"
type = "MTNK"
at = 2700
tolerance = 6

[[check]]
what = "hp"
type = "MTNK"
at = 2990
tolerance = 6
