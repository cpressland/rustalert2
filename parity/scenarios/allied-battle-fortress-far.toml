name = "allied-battle-fortress-far"
description = """
A Battle Fortress's passenger out of range. As allied-battle-fortress, but
the sleeping Neutral Grizzly is 7.6 cells from where the Fortress waits:
beyond its own gun and beyond the GI's Para with OpenToppedRangeBonus=.
Covers whether a passenger takes the Fortress's target when it's out of
reach at the order, as the Fortress drives into range."""
map = "parity_allied_battle_fortress_far.yrm"
end_frame = 3000
human_start = [35, 35]

[generate]
name = "allied-battle-fortress-far"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[GAWEAP]
Prerequisite=POWER,GACNST
Cost=500

[BFRT]
Prerequisite=GAWEAP
Cost=1000
Crusher=no
OmniCrusher=no

"""

[[generate.house]]
name = "Neutral"

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
