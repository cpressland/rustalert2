name = "harvester-queue"
description = """
Two War Miners on Harvest, owned by Neutral, beside a Neutral Soviet
refinery and a 5×5 field of full ore, as harvester-ore with a second
miner. Covers two harvesters sharing a field and a refinery: where each
harvests, and the second waiting for the dock (the queueing cell).

Neutral owns everything so the players (far away at the start points) stay
out of it; Neutral's credits are what the refinery pays into."""
map = "parity_harvester_queue.yrm"
end_frame = 3600
human_start = [35, 35]

[generate]
name = "Parity: two harvesters"
width = 50
height = 50
starts = [[35, 35], [65, 65]]

[[generate.house]]
name = "Neutral"

[[generate.structure]]
owner = "Neutral"
type = "NAREFN"
x = 45
y = 45

[[generate.unit]]
owner = "Neutral"
type = "HARV"
x = 44
y = 49
facing = 64
mission = "Harvest"

[[generate.unit]]
owner = "Neutral"
type = "HARV"
x = 42
y = 49
facing = 64
mission = "Harvest"

[[generate.ore]]
x = 52
y = 44
width = 5
height = 5

# The first load: four cells, eleven bails each until it's full.

# Setting off together, the second miner takes the cell beside the
# first's (a harvester heading for a cell has it)...
[[check]]
what = "position"
type = "HARV"
owner = 2
at = 400
tolerance = 64

# ...and, home together, it waits south of the queueing cell while the
# first is on the pad: one load paid by 1600, the second by 1800 (ours
# come 28 frames before and 33 after the original's).
[[check]]
what = "credits"
house = 2
at = 1600
tolerance = 0

[[check]]
what = "credits"
house = 2
at = 1800
tolerance = 0
