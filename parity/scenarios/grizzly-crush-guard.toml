# The first GI opens fire on the Grizzly as it arrives at its waiting
# cell; the Grizzly fires back, 16 a hit about every 62 frames, though a
# player's unit doesn't take on a Neutral one by itself. Neither GI moves
# aside: each is crushed the frame the Grizzly reaches its cell's middle,
# on 2055 and 2082. The Grizzly, at under half health, drives at three
# quarters of its speed: 27 frames between the two, not 19. Ours drives
# up 5 frames sooner (drive start-up, #40). The GIs, on Guard since the
# start, have deployed by themselves (AIAutoDeployFrameDelay=) and hit
# with their Para from the first shot, 10 a time.
