name = "grizzly-hunts-mcv-north"
description = """
A Grizzly on Hunt, owned by Neutral, starts south of the idle human
player's MCV, so its planned route runs north first (N × 7, then NW),
stops at weapon range and shells it.
Covers driving speed and path, where a unit stops for its weapon's range,
damage (Verses) and rate of fire.

In a skirmish the map's objects are read before the player houses exist, so
only Neutral and Special can own them; Neutral is hostile to the players.
One AI starts in the far corner and doesn't reach the area in time."""
map = "parity_grizzly_hunts_mcv_north.yrm"
end_frame = 900
human_start = [35, 35]

[generate]
name = "Parity: Grizzly hunts MCV, north"
width = 50
height = 50
starts = [[35, 35], [65, 65]]

[[generate.house]]
name = "Neutral"

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 40
y = 50
facing = 64
mission = "Hunt"

# Tolerances: two recordings of the original with the same start differ only
# in when shots land (the gap between shots varies by 0 to 2 frames with the
# seed), so damage checks allow one shot (65) and timing a few frames.

[[check]]
what = "position"
type = "MTNK"
owner = 2
at = 120
tolerance = 64

[[check]]
what = "position"
type = "MTNK"
owner = 2
at = 300
tolerance = 32

[[check]]
what = "first_damage"
type = "AMCV"
owner = 0
window = 3

[[check]]
what = "hp"
type = "AMCV"
owner = 0
at = 600
tolerance = 65

[[check]]
what = "hp"
type = "AMCV"
owner = 0
at = 900
tolerance = 65
