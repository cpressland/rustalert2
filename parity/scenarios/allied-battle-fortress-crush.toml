name = "allied-battle-fortress-crush"
description = """
The Battle Fortress crushing a vehicle. The human player (British) builds
a power plant and a war factory (the map makes the war factory cheaper,
with fewer prerequisites, and the Battle Fortress cheaper and buildable
from the war factory alone), then a Battle Fortress, moves it to a set
cell, and orders it to attack a sleeping Neutral Grizzly. Covers
OmniCrusher=: whether the Fortress drives onto the Grizzly rather than
fighting from range, and what crushing it does. Nothing else is near: the
AI starts in the far corner."""
map = "parity_allied_battle_fortress_crush.yrm"
end_frame = 3000
human_start = [35, 35]

[generate]
name = "allied-battle-fortress-crush"
width = 50
height = 50
starts = [[35, 35], [65, 65]]
rules = """
[GAWEAP]
Prerequisite=POWER,GACNST
Cost=500

[BFRT]
Prerequisite=GAWEAP
Cost=1000

"""

[[generate.house]]
name = "Neutral"

[[generate.unit]]
owner = "Neutral"
type = "MTNK"
x = 50
y = 39
facing = 64
mission = "Sleep"

[[order]]
frame = 30
what = "deploy"
type = "AMCV"

[[order]]
frame = 100
what = "produce"
type = "GAPOWR"

[[order]]
frame = 600
what = "place"
type = "GAPOWR"
x = 38
y = 34

[[order]]
frame = 610
what = "produce"
type = "GAWEAP"

[[order]]
frame = 890
what = "place"
type = "GAWEAP"
x = 41
y = 36

[[order]]
frame = 905
what = "produce"
type = "BFRT"

[[order]]
frame = 1600
what = "move"
type = "BFRT"
x = 47
y = 38

[[order]]
frame = 2000
what = "attack"
type = "BFRT"
target = "MTNK"

[[check]]
what = "count"
type = "MTNK"
at = 1990
tolerance = 0

# Ordered to attack, the Fortress drives onto the Grizzly's cell rather
# than fighting from where it stands (its 20mmRapid reaches 4 cells; the
# Grizzly is 3 off), firing on the way: 6 a hit, 2024 and 2044. The
# Grizzly is gone the frame the Fortress reaches its cell's middle, 2063,
# with no wreck's blast and no crew, and the Fortress has its kill's
# experience: 700 ÷ (1000 × 3). Ours gets there on 2055: our drive takes
# the turn from diagonal to east without slowing (#40). Ours also fires
# from 2002; the original's first shot waits until 2023 (to trace).
[[check]]
what = "event"
type = "MTNK"
owner = 2
event = "removed"
window = 10

[[check]]
what = "count"
type = "MTNK"
at = 2070
tolerance = 0

[[check]]
what = "experience"
type = "BFRT"
at = 2100
tolerance = 0

[[check]]
what = "hp"
type = "BFRT"
at = 2100
tolerance = 0
