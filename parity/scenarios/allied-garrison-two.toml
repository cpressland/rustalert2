name = "allied-garrison-two"
description = """
A garrison of two. As allied-garrison-fire, with three GIs ordered into the
Neutral civilian house (CAHSE01). The second order, while the first GI is
still on its way, goes to the first again, so two go in. Then the house is
ordered to attack the sleeping Neutral Grizzly three cells off. Covers
the reload split between two occupants. The AI starts in the far corner."""
