[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/cpressland/rustalert2"
publish = false

[workspace.dependencies]
ra2-formats = { path = "crates/ra2-formats" }
ra2-vfs = { path = "crates/ra2-vfs" }
ra2-rules = { path = "crates/ra2-rules" }
ra2-sim = { path = "crates/ra2-sim" }
ra2-render = { path = "crates/ra2-render" }
ra2-audio = { path = "crates/ra2-audio" }
ra2-video = { path = "crates/ra2-video" }
ra2-ui = { path = "crates/ra2-ui" }
ra2-net = { path = "crates/ra2-net" }

serde = { version = "1", features = ["derive"] }
toml = "1"
tempfile = "3"
blowfish = "0.10"
num-bigint = "0.5"
crc32fast = "1"
sha1 = "0.11"
png = "0.18"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"
verbose_bit_mask = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# The sim is the hot path even in debug builds; keep tests and play usable.
[profile.dev.package.ra2-sim]
opt-level = 2
