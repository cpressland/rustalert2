name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  game-data-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I tools/game_data_guard.py

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the first target. Linux runs too, so platform assumptions
        # show up long before the Linux milestone.
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: tools/check_sim_deps.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    # Every parser takes untrusted bytes; none may panic. 30 s per target
    # per run; crashes upload as an artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The repository pins stable in rust-toolchain.toml; fuzzing needs nightly.
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Run each target
        working-directory: fuzz
        run: |
          failed=""
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            cargo +nightly fuzz run "$t" -- -max_total_time=30 -rss_limit_mb=2048 || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::crashes in:$failed"; exit 1; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
